<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schach-Analyse</title>
<style>
  :root {
    --bg: #f3f1ec; --panel: #ffffff; --text: #23211d; --muted: #6b675f;
    --light: #ebe3cf; --dark: #8a9a7b; --sel: #e8c547; --hint: rgba(35,33,29,.28);
    --line: #d8d3c7; --accent: #2f5d50;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d1a; --panel: #262723; --text: #ecebe6; --muted: #a09d94;
      --light: #cfc8b4; --dark: #6f8062; --sel: #d4b43c; --hint: rgba(0,0,0,.35);
      --line: #3a3b36; --accent: #8fc4b0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .layout { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .boardArea { display: flex; gap: 10px; }
  #evalbar { width: 26px; height: min(80vw, 480px); background: #222; border-radius: 4px;
             overflow: hidden; position: relative; border: 1px solid var(--line); }
  #evalWhite { position: absolute; bottom: 0; left: 0; right: 0; background: #f4f4f0;
               height: 50%; transition: height .4s; }
  #evalText { position: absolute; left: 0; right: 0; font-size: 11px; text-align: center;
              font-weight: 600; }
  #board { display: grid; grid-template-columns: repeat(8, 1fr);
           width: min(80vw, 480px); height: min(80vw, 480px);
           border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
           user-select: none; }
  .sq { display: flex; align-items: center; justify-content: center; position: relative;
        font-size: min(7.4vw, 44px); cursor: pointer; line-height: 1; }
  .sq.l { background: var(--light); } .sq.d { background: var(--dark); }
  .sq.sel { background: var(--sel); }
  .sq.hint::after { content: ""; width: 28%; height: 28%; border-radius: 50%;
                    background: var(--hint); position: absolute; }
  .sq.hint.cap::after { width: 86%; height: 86%; background: none;
                        border: 4px solid var(--hint); }
  .sq.last { box-shadow: inset 0 0 0 3px var(--sel); }
  .pw { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 2px #000; }
  .pb { color: #1a1a1a; }
  .panel { flex: 1; min-width: 260px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 1rem; margin: 0 0 8px; }
  .row { margin-bottom: 14px; }
  .big { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
  .muted { color: var(--muted); font-size: .9rem; }
  button { font: inherit; padding: 8px 12px; margin: 0 6px 6px 0; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--text);
           cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, .sq:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #moves { font-size: .95rem; line-height: 1.6; max-height: 140px; overflow-y: auto; }
  textarea { width: 100%; font: inherit; font-size: .85rem; padding: 8px; margin-bottom: 6px;
             border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
             color: var(--text); resize: vertical; }
  .cur { background: var(--sel); color: #111; border-radius: 3px; padding: 0 3px; }
  .mv { cursor: pointer; }
  select { font: inherit; padding: 7px; margin: 0 6px 6px 0; border-radius: 6px;
           border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .b1 { color: #b8860b; } .b2 { color: #d9731a; } .b3 { color: #c0392b; font-weight: 700; }
  .cur.b1, .cur.b2, .cur.b3 { color: #111; }
  #summary table { border-collapse: collapse; font-size: .9rem; margin: 6px 0; }
  #summary td, #summary th { padding: 3px 10px 3px 0; text-align: left; font-weight: 400; }
  #summary th { color: var(--muted); }
  #graph { width: 100%; height: 70px; background: var(--bg); border: 1px solid var(--line);
           border-radius: 6px; cursor: pointer; }
  #status { font-size: .85rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Schach-Analyse</h1>
  <div class="layout">
    <div class="boardArea">
      <div id="evalbar" aria-label="Bewertungsbalken">
        <div id="evalWhite"></div>
        <div id="evalText" style="top:4px;color:#fff">0.0</div>
      </div>
      <div id="board" role="grid" aria-label="Schachbrett"></div>
    </div>

    <div class="panel">
      <div class="row">
        <h2>Bewertung</h2>
        <div class="big" id="scoreBig">0.0</div>
        <div class="muted" id="scoreInfo">Engine wird geladen …</div>
      </div>
      <div class="row">
        <h2>Bester Zug</h2>
        <div id="bestMove" class="big" style="font-size:1.3rem">–</div>
        <div class="muted" id="pvLine"></div>
      </div>
      <div class="row">
        <h2>Züge</h2>
        <div id="moves" class="muted">Noch keine Züge.</div>
        <div id="moveNote" style="margin-top:6px;font-size:.9rem"></div>
      </div>
      <div class="row">
        <button id="first" title="Zum Anfang">⏮</button>
        <button id="prev" title="Ein Zug zurück (←)">◀</button>
        <button id="next" title="Ein Zug vor (→)">▶</button>
        <button id="last" title="Zum Ende">⏭</button>
      </div>
      <div class="row">
        <h2>Partie laden (PGN)</h2>
        <textarea id="pgn" rows="4" placeholder="PGN hier einfügen, z. B. von chess.com oder lichess.org"></textarea>
        <button id="loadPgn">Partie laden</button>
      </div>
      <div class="row">
        <h2>Partieanalyse</h2>
        <select id="depth">
          <option value="10">Schnell</option>
          <option value="13" selected>Normal</option>
          <option value="16">Gründlich</option>
        </select>
        <button id="analyzeAll">Partie analysieren</button>
        <div class="muted" id="progress"></div>
        <div id="summary"></div>
        <svg id="graph" viewBox="0 0 300 70" preserveAspectRatio="none" style="display:none"></svg>
      </div>
      <div>
        <button id="undo">Zug zurück</button>
        <button id="reset">Neue Partie</button>
        <button id="flip">Brett drehen</button>
      </div>
      <div id="status"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const game = new Chess();
let flipped = false, selected = null, lastMove = null;
let engine = null, engineReady = false, analysisId = 0;

const GLYPH = { p:"♟", n:"♞", b:"♝", r:"♜", q:"♛", k:"♚" };
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");

/* ---------- Brett zeichnen ---------- */
function render() {
  boardEl.innerHTML = "";
  const legal = selected ? game.moves({ square: selected, verbose: true }) : [];
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const file = flipped ? 7 - f : f;
      const rank = flipped ? r : 7 - r;
      const name = "abcdefgh"[file] + (rank + 1);
      const piece = game.get(name);
      const el = document.createElement("div");
      el.className = "sq " + ((file + rank) % 2 === 1 ? "l" : "d");
      el.tabIndex = 0;
      el.dataset.sq = name;
      if (name === selected) el.classList.add("sel");
      if (lastMove && (name === lastMove.from || name === lastMove.to)) el.classList.add("last");
      const m = legal.find(x => x.to === name);
      if (m) { el.classList.add("hint"); if (piece) el.classList.add("cap"); }
      if (piece) {
        const s = document.createElement("span");
        s.className = piece.color === "w" ? "pw" : "pb";
        s.textContent = GLYPH[piece.type];
        el.appendChild(s);
      }
      el.addEventListener("click", () => onSquare(name));
      el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSquare(name); } });
      boardEl.appendChild(el);
    }
  }
  renderMoves();
}

function onSquare(name) {
  if (game.game_over()) return;
  if (selected) {
    const legal = game.moves({ square: selected, verbose: true });
    const m = legal.find(x => x.to === name);
    if (m) {
      const made = game.move({ from: selected, to: name, promotion: "q" });
      lastMove = made; selected = null;
      syncLine(); render(); analyze(); return;
    }
  }
  const p = game.get(name);
  selected = (p && p.color === game.turn()) ? name : null;
  render();
}

let line = [], cursor = 0, an = null, pending = 0, batch = { running: false };   // line = alle Züge der Partie, cursor = aktuelle Stellung

function renderMoves() {
  const el = document.getElementById("moves");
  if (!line.length) { el.textContent = "Noch keine Züge."; return; }
  el.innerHTML = "";
  line.forEach((m, i) => {
    if (i % 2 === 0) el.append((i / 2 + 1) + ". ");
    const s = document.createElement("span");
    const c = an ? an.cls[i] : 0;
    s.className = "mv" + (i + 1 === cursor ? " cur" : "") + (c ? " b" + c : "");
    s.textContent = m.san + (c ? ["", "?!", "?", "??"][c] : "");
    s.onclick = () => goTo(i + 1);
    el.append(s, " ");
  });
  const cu = el.querySelector(".cur");
  if (cu) cu.scrollIntoView({ block: "nearest" });
  const note = document.getElementById("moveNote");
  const k = cursor - 1;
  note.textContent = (an && k >= 0 && an.cls[k] && an.bestSan[k]) ? "Besser wäre: " + an.bestSan[k] : "";
}

function syncLine() { an = null; line = game.history({ verbose: true }); cursor = line.length; }

function goTo(n) {
  n = Math.max(0, Math.min(line.length, n));
  game.reset();
  for (let i = 0; i < n; i++) game.move({ from: line[i].from, to: line[i].to, promotion: line[i].promotion });
  cursor = n; lastMove = n ? line[n - 1] : null; selected = null;
  render(); analyze();
}

/* ---------- Engine (Stockfish im Browser) ---------- */
const ENGINE_URLS = [
  "https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js",
  "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js"
];

function startEngine(i = 0) {
  if (i >= ENGINE_URLS.length) {
    document.getElementById("scoreInfo").textContent =
      "Engine konnte nicht geladen werden. Bist du online?";
    return;
  }
  try {
    const blob = new Blob(['importScripts("' + ENGINE_URLS[i] + '");'], { type: "application/javascript" });
    const w = new Worker(URL.createObjectURL(blob));
    let ok = false;
    w.onerror = () => { if (!ok) { w.terminate(); startEngine(i + 1); } };
    w.onmessage = e => {
      const line = typeof e.data === "string" ? e.data : "";
      if (line === "uciok") { w.postMessage("isready"); }
      if (line === "readyok" && !ok) {
        ok = true; engine = w; engineReady = true; analyze();
      }
      if (ok) handleEngine(line);
    };
    w.postMessage("uci");
  } catch (err) { startEngine(i + 1); }
}

function analyze() {
  if (!engineReady || batch.running) return;
  const id = ++analysisId;
  engine.postMessage("stop");
  const fen = game.fen();
  if (game.game_over()) { showResult(); return; }
  go(fen, 16);
  document.getElementById("scoreInfo").textContent = "Analysiere …";
  engine._fen = fen; engine._id = id;
}

function go(fen, depth) {
  pending++;
  engine.postMessage("position fen " + fen);
  engine.postMessage("go depth " + depth);
}

function handleEngine(line) {
  if (line.startsWith("bestmove")) {
    pending = Math.max(0, pending - 1);
    if (batch.running && pending === 0) batchResult(line.split(" ")[1]);
    return;
  }
  if (batch.running) { batchInfo(line); return; }
  if (line.startsWith("info") && line.includes(" score ") && line.includes(" pv ")) {
    const depth = (line.match(/ depth (\d+)/) || [])[1];
    const cp = line.match(/ score cp (-?\d+)/);
    const mate = line.match(/ score mate (-?\d+)/);
    const pv = line.split(" pv ")[1].trim().split(" ");
    const white = game.turn() === "w";
    let text, pct;
    if (mate) {
      let m = parseInt(mate[1]); if (!white) m = -m;
      text = (m > 0 ? "+" : "-") + "M" + Math.abs(m);
      pct = m > 0 ? 100 : 0;
    } else if (cp) {
      let v = parseInt(cp[1]); if (!white) v = -v;
      const pawns = v / 100;
      text = (pawns > 0 ? "+" : "") + pawns.toFixed(1);
      pct = 50 + 50 * (2 / (1 + Math.exp(-0.004 * v)) - 1);
    } else return;
    document.getElementById("scoreBig").textContent = text;
    document.getElementById("evalText").textContent = text;
    document.getElementById("evalText").style.color = pct > 50 ? "#111" : "#fff";
    document.getElementById("evalText").style.top = pct > 50 ? "auto" : "4px";
    document.getElementById("evalText").style.bottom = pct > 50 ? "4px" : "auto";
    document.getElementById("evalWhite").style.height = pct + "%";
    document.getElementById("scoreInfo").textContent = "Tiefe " + depth + " (Weiß aus Sicht von Weiß)";
    // Zugfolge in lesbarer Schreibweise
    const tmp = new Chess(game.fen());
    const san = [];
    for (const u of pv.slice(0, 6)) {
      const mv = tmp.move({ from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4] });
      if (!mv) break; san.push(mv.san);
    }
    document.getElementById("bestMove").textContent = san[0] || "–";
    document.getElementById("pvLine").textContent = san.join("  ");
  }
}

function showResult() {
  let msg = "Remis.";
  if (game.in_checkmate()) msg = "Schachmatt – " + (game.turn() === "w" ? "Schwarz" : "Weiß") + " gewinnt.";
  document.getElementById("scoreInfo").textContent = msg;
  document.getElementById("bestMove").textContent = "–";
  document.getElementById("pvLine").textContent = "";
}

/* ---------- Knöpfe ---------- */
document.getElementById("undo").onclick = () => {
  game.undo(); syncLine(); goTo(cursor);
};
document.getElementById("reset").onclick = () => {
  line = []; an = null; clearSummary(); goTo(0);
};
document.getElementById("first").onclick = () => goTo(0);
document.getElementById("prev").onclick = () => goTo(cursor - 1);
document.getElementById("next").onclick = () => goTo(cursor + 1);
document.getElementById("last").onclick = () => goTo(line.length);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowLeft") goTo(cursor - 1);
  if (e.key === "ArrowRight") goTo(cursor + 1);
});
document.getElementById("loadPgn").onclick = () => {
  const text = document.getElementById("pgn").value.trim();
  const g = new Chess();
  if (!text || !g.load_pgn(text)) {
    statusEl.textContent = "Das PGN konnte nicht gelesen werden. Prüfe, ob du alles kopiert hast.";
    return;
  }
  statusEl.textContent = "";
  line = g.history({ verbose: true }); an = null;
  clearSummary(); goTo(0);
};
document.getElementById("flip").onclick = () => { flipped = !flipped; render(); };

/* ---------- Ganze Partie analysieren ---------- */
const winPct = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1);

function clearSummary() {
  document.getElementById("summary").innerHTML = "";
  document.getElementById("graph").style.display = "none";
  document.getElementById("progress").textContent = "";
}

function startAnalysis() {
  if (batch.running) { batch.cancel = true; return; }
  if (!engineReady) { statusEl.textContent = "Die Engine ist noch nicht bereit."; return; }
  if (!line.length) { statusEl.textContent = "Lade zuerst eine Partie oder spiele ein paar Züge."; return; }
  statusEl.textContent = "";
  const t = new Chess(), fens = [t.fen()];
  line.forEach(m => { t.move({ from: m.from, to: m.to, promotion: m.promotion }); fens.push(t.fen()); });
  batch = { running: true, i: 0, fens, evals: [], bests: [], last: null,
            depth: parseInt(document.getElementById("depth").value), cancel: false };
  document.getElementById("analyzeAll").textContent = "Abbrechen";
  engine.postMessage("stop");
  runNext();
}

function runNext() {
  if (batch.cancel) return endBatch(false);
  while (batch.i < batch.fens.length) {
    const g = new Chess(batch.fens[batch.i]);
    if (!g.game_over()) break;
    batch.evals[batch.i] = g.in_checkmate() ? (g.turn() === "w" ? -10000 : 10000) : 0;
    batch.bests[batch.i] = null; batch.i++;
  }
  if (batch.i >= batch.fens.length) return endBatch(true);
  document.getElementById("progress").textContent =
    "Analysiere Stellung " + (batch.i + 1) + " von " + batch.fens.length + " …";
  batch.last = null;
  go(batch.fens[batch.i], batch.depth);
}

function batchInfo(l) {
  if (pending !== 1 || !l.startsWith("info") || !l.includes(" score ")) return;
  const cp = l.match(/ score cp (-?\d+)/), mate = l.match(/ score mate (-?\d+)/);
  let v;
  if (cp) v = parseInt(cp[1]);
  else if (mate) { const m = parseInt(mate[1]); v = (m > 0 ? 1 : -1) * (10000 - Math.abs(m)); }
  else return;
  if (batch.fens[batch.i].split(" ")[1] === "b") v = -v;
  batch.last = v;
}

function batchResult(uci) {
  batch.evals[batch.i] = batch.last === null ? 0 : batch.last;
  batch.bests[batch.i] = uci && uci !== "(none)" ? uci : null;
  batch.i++;
  runNext();
}

function endBatch(done) {
  const b = batch;
  batch = { running: false };
  document.getElementById("analyzeAll").textContent = "Partie analysieren";
  if (!done) { document.getElementById("progress").textContent = "Analyse abgebrochen."; analyze(); return; }
  document.getElementById("progress").textContent = "";
  const n = line.length;
  const cls = [], accs = { w: [], b: [] }, cnt = { w: [0, 0, 0], b: [0, 0, 0] }, bestSan = [];
  for (let i = 0; i < n; i++) {
    const side = i % 2 === 0 ? "w" : "b";
    const before = winPct(b.evals[i]), after = winPct(b.evals[i + 1]);
    const loss = Math.max(0, side === "w" ? before - after : after - before);
    const acc = Math.min(100, Math.max(0, 103.1668 * Math.exp(-0.04354 * loss) - 3.1669));
    accs[side].push(acc);
    const played = line[i].from + line[i].to + (line[i].promotion || "");
    let c = 0;
    if (played !== b.bests[i]) c = loss >= 30 ? 3 : loss >= 20 ? 2 : loss >= 10 ? 1 : 0;
    cls.push(c);
    if (c) cnt[side][c - 1]++;
    bestSan[i] = null;
    if (b.bests[i]) {
      const t = new Chess(b.fens[i]);
      const mv = t.move({ from: b.bests[i].slice(0, 2), to: b.bests[i].slice(2, 4), promotion: b.bests[i][4] });
      if (mv) bestSan[i] = mv.san;
    }
  }
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : "–";
  an = { evals: b.evals, cls, bestSan };
  document.getElementById("summary").innerHTML =
    "<table><tr><th></th><th>Weiß</th><th>Schwarz</th></tr>" +
    "<tr><td>Genauigkeit</td><td><b>" + avg(accs.w) + " %</b></td><td><b>" + avg(accs.b) + " %</b></td></tr>" +
    "<tr><td>Ungenauigkeiten</td><td>" + cnt.w[0] + "</td><td>" + cnt.b[0] + "</td></tr>" +
    "<tr><td>Fehler</td><td>" + cnt.w[1] + "</td><td>" + cnt.b[1] + "</td></tr>" +
    "<tr><td>Patzer</td><td>" + cnt.w[2] + "</td><td>" + cnt.b[2] + "</td></tr></table>";
  drawGraph();
  render(); analyze();
}

function drawGraph() {
  const g = document.getElementById("graph"), ev = an.evals, n = ev.length - 1;
  const pts = ev.map((cp, i) => (n ? i / n * 300 : 0).toFixed(1) + "," + (70 - winPct(cp) / 100 * 70).toFixed(1));
  g.innerHTML = '<line x1="0" y1="35" x2="300" y2="35" stroke="currentColor" opacity=".3"/>' +
    '<polyline fill="none" stroke="#2f5d50" stroke-width="2" vector-effect="non-scaling-stroke" points="' + pts.join(" ") + '"/>';
  g.style.display = "block";
  g.onclick = e => {
    const r = g.getBoundingClientRect();
    goTo(Math.round((e.clientX - r.left) / r.width * n));
  };
}

document.getElementById("analyzeAll").onclick = startAnalysis;

render();
if (typeof Chess === "undefined") {
  statusEl.textContent = "Fehler: chess.js konnte nicht geladen werden. Bist du online?";
} else {
  startEngine();
}
</script>
</body>
</html>
